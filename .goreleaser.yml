version: 2

# The asset names the npm and PyPI launchers reconstruct are
# "<project_name>_<version>_<os>_<arch>.<ext>", so the project name is
# declared rather than inferred from the repository directory.
project_name: selfdoc

builds:
  - main: ./cmd/selfdoc
    env:
      - CGO_ENABLED=0
    # No -X main.Version: the binary reads its version from the repository's
    # VERSION file, embedded at compile time by version.go's //go:embed. The
    # tree goreleaser builds is the release commit, so VERSION is already the
    # released version and an ldflag would only shadow it with a second answer.
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
