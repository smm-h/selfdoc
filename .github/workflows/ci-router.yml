# DO NOT EDIT -- generated by rlsbl monorepo sync
name: CI Router
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: Run every project's CI jobs, ignoring the paths filter. Use
          this to make a release candidate's members run their own CI on a 
          commit whose push window does not touch their paths.
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}-${{ inputs.run_all }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.changes.outputs.root }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          root: '**'
        predicate-quantifier: some-with-excludes
  root-ci-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      # go.mod: go 1.26.3
    - uses: actions/setup-go@v6
      with:
        go-version-file: ./go.mod
    - run: go vet ./...
      # The suite needs python3 for two reasons: the Python extractor runs its
      # driver through it, and the build indexes its output with Pagefind,
      # which is installed here as a Python distribution. Without Pagefind on
      # the runner every build-touching test skips itself, so this step is what
      # makes them run at all.
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - run: pip install 'pagefind[bin]'
    - run: python3 -m pagefind --version
      # -short, and the browser assertions sit behind the `e2e` build tag, so
      # this runs neither. The e2e suite drives a real headless Chromium that
      # playwright-go downloads at run time; CI does not pay for that download.
      # Run it locally with `go test -tags e2e ./internal/e2e/...`.
    - run: go test ./... -race -short -timeout=10m
    defaults:
      run:
        working-directory: .
    name: root-ci / test
    needs:
    - detect
    if: (needs.detect.outputs.root == 'true' || inputs.run_all)
