[project]
name = "selfdoc"
version = "0.8.0"
description = "Code-aware static site generator with directive-based content extraction"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["documentation", "static-site-generator", "docstring", "jsdoc", "selfdoc", "rlsbl"]
dependencies = ["strictcli>=0.7.0"]

[project.optional-dependencies]
perf = ["brotli>=1.1"]
og = ["predraw>=0.2.0"]

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[project.scripts]
selfdoc = "selfdoc:main"

[tool.uv.sources]
strictcli = { path = "../strictcli/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
]
