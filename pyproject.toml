[project]
name = "selfdoc"
version = "0.25.0"
description = "Code-aware static site generator with directive-based content extraction"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["documentation", "static-site-generator", "docstring", "jsdoc", "selfdoc", "rlsbl"]
dependencies = ["strictcli"]

[project.optional-dependencies]
perf = ["brotli>=1.1"]
og = ["predraw"]

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[project.scripts]
selfdoc = "selfdoc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E"]
ignore = ["E501"]
