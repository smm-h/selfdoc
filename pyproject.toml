[project]
name = "selfdoc"
version = "0.1.0"
description = "Code-aware static site generator with directive-based content extraction"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["documentation", "static-site-generator", "docstring", "jsdoc", "selfdoc", "rlsbl"]
dependencies = []

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[project.scripts]
selfdoc = "selfdoc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.0.3"]
