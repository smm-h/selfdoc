# The PyPI distribution of selfdoc is a launcher, not the program. The program
# is the Go binary at ./cmd/selfdoc, published as GitHub Release assets by
# goreleaser; the `selfdoc` console script here downloads the asset matching
# this version and platform on first invocation, verifies it against the
# release's checksums.txt, caches it, and execs it. Stdlib only -- a launcher
# with a dependency would be a dependency the binary does not have.

[project]
name = "selfdoc"
version = "0.38.1"
description = "Code-aware static site generator with directive-based content extraction"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["documentation", "static-site-generator", "docstring", "jsdoc", "selfdoc", "rlsbl"]

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[project.scripts]
selfdoc = "selfdoc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfdoc"]

[tool.hatch.build.targets.sdist]
# only-include, not include: hatchling include patterns are gitignore-style
# and match a path COMPONENT at any depth, so "selfdoc" also pulled in
# cmd/selfdoc and the whole .rlsbl-monorepo/releasables/selfdoc tree.
only-include = ["selfdoc", "README.md", "LICENSE"]
