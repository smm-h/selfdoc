# Build config for the selfblog package. The pyproject lives inside
# the package directory (flat monorepo layout): the wheel is built by
# remapping the package contents under "selfblog/" via hatch sources,
# and editable installs put the repo root on sys.path via dev-mode-dirs.

[project]
name = "selfblog"
version = "0.4.4"
description = "Blog system for selfdoc-based documentation sites"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["blog", "documentation", "static-site-generator", "selfdoc", "rlsbl"]
# Floors, not pins -- upper bounds stay banned. selfdoc-core>=0.9.2 because
# selfblog renders every post through the engine, and before 0.9.2 a post
# built for a mounted project wrote its links back into the project against
# the wrong root; strictcli>=0.41.0 because cli.py is written against the
# declaration regime: every flag and arg declares `presence=`, every
# `choices=` entry is a `strictcli.Choice(...)` record, and the arg surface's
# `required=` keyword no longer exists. An older strictcli rejects `presence=`
# at registration, so the app does not build at all below the floor. (0.39.0
# was the previous floor, for `App.call(..., approve_consequential=...)`: the
# keyword-only consent parameter the editor's publish surface passes, which
# before 0.39.0 landed in the command's own kwargs and failed as an unknown
# parameter rather than carrying consent.)
dependencies = ["selfdoc-core>=0.9.2", "strictcli>=0.41.0"]

[project.optional-dependencies]
perf = ["brotli>=1.1"]

[project.scripts]
selfblog = "selfblog:main"

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# editor_ui holds the authoring app's own shell: an HTML page, an ES module
# and a stylesheet, served verbatim by editor_server and located through
# importlib.resources. They are not Python, so the "*.py" pattern would leave
# them out of the wheel and the installed editor would serve 404s.
include = ["*.py", "editor_ui/*.html", "editor_ui/*.js", "editor_ui/*.css"]
exclude = ["pyproject.toml"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "selfblog"

[tool.hatch.build.targets.sdist]
include = [
    "*.py", "editor_ui/*.html", "editor_ui/*.js", "editor_ui/*.css",
    "README.md", "LICENSE",
]

[tool.uv.sources]
selfdoc-core = { workspace = true }
selfdoc = { workspace = true }

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
    # axe-core, bundled as a JS blob the driver injects -- the
    # accessibility assertions in tests/test_rendered_reality.py run it
    # against a live page, and it reaches no network to do so.
    "axe-playwright-python>=0.1.8",
    # The isolation floor. CI syncs from this directory, so the plugin has to
    # be declared here -- inheriting it from the workspace root's dev group
    # only works for root-rooted runs.
    "stricttest",
    # The indexer every build shells out to, declared here for the same reason
    # as stricttest: this member's testpaths runs the root suite, which builds
    # real sites, and a member-rooted sync never sees the root's dev group.
    "pagefind[bin]>=1.4.0",
    # `assembly sync-workflow` pins the selfdoc INSTALLED beside it, and the
    # root suite tests that behavior, so this member's CI environment has to
    # have selfdoc installed -- importable from the repository is not enough,
    # the pin is read from distribution metadata. Dev-only, and not a cycle:
    # selfdoc does not depend on selfblog in either direction.
    "selfdoc",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
# stricttest's isolation floor. A member-rooted pytest run reads THIS file as
# its inifile, and testpaths points at the root suite -- so the stance must
# match the root pyproject's, including loopback = "allow" for the demo-panel
# test and the rendered-reality suite, both of which bind 127.0.0.1 servers and
# drive them with headless chromium.
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "allow"
stricttest_sandbox_required = "false"

markers = [
    # The rendered-reality suite: real fixture sites, built through the real
    # pipeline, served on loopback and asserted in headless chromium. It is
    # slower than the rest of the suite by a wide margin and needs a browser
    # binary, so it is selectable -- `-m e2e_rendered` runs only it,
    # `-m 'not e2e_rendered'` runs everything else. CI runs both.
    "e2e_rendered: browser assertions against a really-built site",
]
