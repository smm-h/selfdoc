# Build config for the selfblog package. The pyproject lives inside
# the package directory (flat monorepo layout): the wheel is built by
# remapping the package contents under "selfblog/" via hatch sources,
# and editable installs put the repo root on sys.path via dev-mode-dirs.

[project]
name = "selfblog"
version = "0.1.0"
description = "Blog system for selfdoc-based documentation sites"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["blog", "documentation", "static-site-generator", "selfdoc", "rlsbl"]
dependencies = ["selfdoc-core", "strictcli"]

[project.optional-dependencies]
perf = ["brotli>=1.1"]

[project.scripts]
selfblog = "selfblog:main"

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
exclude = ["pyproject.toml"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "selfblog"

[tool.hatch.build.targets.sdist]
include = ["*.py", "README.md", "LICENSE"]

[tool.uv.sources]
selfdoc-core = { workspace = true }

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
