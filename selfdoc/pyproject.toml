# Build config for the selfdoc package (CLI + docs-site frontend).
# The pyproject lives inside the package directory (flat monorepo layout):
# the wheel is built by remapping the package contents under "selfdoc/" via
# hatch sources, and editable installs put the repo root on sys.path via
# dev-mode-dirs. The npm wrapper (package.json + bin/) lives alongside and
# is excluded from Python artifacts by the include whitelists below.

[project]
name = "selfdoc"
version = "0.38.0"
description = "Code-aware static site generator with directive-based content extraction"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["documentation", "static-site-generator", "docstring", "jsdoc", "selfdoc", "rlsbl"]
# Floors, not pins -- upper bounds stay banned. selfdoc-core>=0.9.2 because the
# engine writes every reference a build emits, and before 0.9.2 the ones
# crossing a shared site's mount named addresses the site does not serve; a
# consumer that resolved an older core against this selfdoc would build a
# documentation tree with dead links in it.
# strictcli>=0.41.0 because cli.py is written against the declaration regime:
# every flag and arg declares `presence=`, every `choices=` entry is a
# `strictcli.Choice(...)` record, and the arg surface's `required=` keyword no
# longer exists. An older strictcli rejects `presence=` at registration, so the
# app does not build at all below the floor. (0.40.0 was the previous floor,
# for machine mode: `check`, `spell-corpus` and `quality` declare a
# `payload_schema=` and answer through `ctx.payload()` / `ctx.json`.)
dependencies = ["strictcli>=0.41.0", "selfdoc-core>=0.9.2"]

[project.optional-dependencies]
perf = ["selfdoc-core[perf]>=0.9.2"]
og = ["selfdoc-core[og]>=0.9.2"]

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[project.scripts]
selfdoc = "selfdoc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No JS or theme include patterns: those assets are selfdoc_core's, and the
# loader and the themes shim read them from there. A copy here would be
# packaged and never loaded, which is how the theme CSS drifted 58 lines.
include = ["*.py"]
exclude = ["pyproject.toml"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "selfdoc"

[tool.hatch.build.targets.sdist]
include = ["*.py", "README.md", "LICENSE"]

[tool.uv.sources]
selfdoc-core = { workspace = true }

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
    # axe-core, bundled as a JS blob the driver injects -- the
    # accessibility assertions in tests/test_rendered_reality.py run it
    # against a live page, and it reaches no network to do so.
    "axe-playwright-python>=0.1.8",
    # The isolation floor. CI syncs from this directory, so the plugin has to
    # be declared here -- inheriting it from the workspace root's dev group
    # only works for root-rooted runs.
    "stricttest",
    # The indexer every build shells out to, declared here for the same reason
    # as stricttest: this member's testpaths runs the root suite, which builds
    # real sites, and a member-rooted sync never sees the root's dev group.
    "pagefind[bin]>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
# stricttest's isolation floor. A member-rooted pytest run reads THIS file as
# its inifile, and testpaths points at the root suite -- so the stance must
# match the root pyproject's, including loopback = "allow" for the demo-panel
# test and the rendered-reality suite, both of which bind 127.0.0.1 servers and
# drive them with headless chromium.
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "allow"
stricttest_sandbox_required = "false"

markers = [
    # The rendered-reality suite: real fixture sites, built through the real
    # pipeline, served on loopback and asserted in headless chromium. It is
    # slower than the rest of the suite by a wide margin and needs a browser
    # binary, so it is selectable -- `-m e2e_rendered` runs only it,
    # `-m 'not e2e_rendered'` runs everything else. CI runs both.
    "e2e_rendered: browser assertions against a really-built site",
]
