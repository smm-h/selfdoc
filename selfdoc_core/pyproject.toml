# Build config for the selfdoc_core package. The pyproject lives inside
# the package directory (flat monorepo layout): the wheel is built by
# remapping the package contents under "selfdoc_core/" via hatch sources,
# and editable installs put the repo root on sys.path via dev-mode-dirs.

[project]
name = "selfdoc-core"
version = "0.5.0"
description = "Shared engine for code-aware documentation generation"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["documentation", "static-site-generator", "docstring", "selfdoc", "rlsbl"]
dependencies = []

[project.optional-dependencies]
perf = ["brotli>=1.1"]
og = ["predraw"]

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "js/*.js", "themes/*.css", "themes/*.json"]
exclude = ["pyproject.toml"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "selfdoc_core"

[tool.hatch.build.targets.sdist]
include = ["*.py", "js/*.js", "themes/*.css", "themes/*.json", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
