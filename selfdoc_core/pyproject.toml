# Build config for the selfdoc_core package. The pyproject lives inside
# the package directory (flat monorepo layout): the wheel is built by
# remapping the package contents under "selfdoc_core/" via hatch sources,
# and editable installs put the repo root on sys.path via dev-mode-dirs.

[project]
name = "selfdoc-core"
version = "0.8.1"
description = "Shared engine for code-aware documentation generation"
license = "MIT"
authors = [{ name = "smm-h" }]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["documentation", "static-site-generator", "docstring", "selfdoc", "rlsbl"]
dependencies = [
    "strictspec>=0.1.0",
    "strictcli",
]

[project.optional-dependencies]
perf = ["brotli>=1.1"]
og = ["predraw"]

[project.urls]
Repository = "https://github.com/smm-h/selfdoc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py", "directives.toml", "lints.toml", "js/*.js", "themes/*.css", "themes/*.json"]
exclude = ["pyproject.toml"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "selfdoc_core"

[tool.hatch.build.targets.sdist]
include = ["*.py", "directives.toml", "lints.toml", "js/*.js", "themes/*.css", "themes/*.json", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.7.2",
    # The isolation floor. CI syncs from this directory, so the plugin has to
    # be declared here -- inheriting it from the workspace root's dev group
    # only works for root-rooted runs.
    "stricttest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# stricttest's isolation floor. The plugin lives in the workspace venv, so a
# member-rooted pytest run (which is what rlsbl's per-member preflight does)
# reads THIS file as its inifile and demands the stance here too. These four
# tests are pure unit tests over the catalog and directive paths -- nothing
# opens a socket -- so the stance is the fully restrictive one.
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "deny"
stricttest_sandbox_required = "false"
