
[[releasables]]
name = "selfdoc"
tag_format = "v{version}"

[[releasables]]
name = "selfdoc-core"

[[releasables]]
name = "selfblog"



[[projects]]
path = "selfdoc_core"
name = "selfdoc-core"
library = true
releasable = "selfdoc-core"
watch = ["selfdoc_core/**"]

[[projects]]
path = "selfblog"
name = "selfblog"
releasable = "selfblog"
watch = ["selfblog/**"]

[[projects]]
path = "selfdoc/"
name = "selfdoc"
releasable = "selfdoc"
watch = ["selfdoc/**", "docs/**", "scripts/**", "tests/**", "selfdoc.json", "pyproject.toml", "uv.lock", "LICENSE"]
