
[[releasables]]
name = "selfdoc"
tag_format = "v{version}"

[[releasables]]
name = "selfdoc-core"

[[releasables]]
name = "selfblog"



[[projects]]
path = "selfdoc_core"
name = "selfdoc-core"
library = true
releasable = "selfdoc-core"
# The workspace root's manifest and lockfile define the environment every
# member's CI builds, so a change to either has to re-run this member's jobs
# too. Without them a lockfile-only fix leaves this member's job `skipped` on
# the release candidate, which the publish check refuses.

[[projects]]
path = "selfblog"
name = "selfblog"
releasable = "selfblog"
# Same reason as selfdoc-core above: the shared manifest and lockfile decide
# what this member's CI installs.

[[projects]]
path = "selfdoc/"
name = "selfdoc"
releasable = "selfdoc"

[[projects]]
path = "."
name = "root"
dev_only = true
releasable = false
