[releasables.selfdoc]
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "minor"
# Short description of this release (required)
description = "baseline accept command and gen-index staleness fix"
# Optional context explaining why these changes were made
context = "Adds `selfdoc baseline accept` for clearing staleness dead-ends on pages with dynamic content. Fixes gen-index to use content-aware seeded descriptions, preventing STALE001 deadlocks on generated index pages."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
include = ["npm", "pypi"]
exclude = []

[releasables.selfdoc-core]
# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "patch"
# Short description of this release (required)
description = "hash raw template body for STALE001 instead of resolved content"
# Optional context explaining why these changes were made
context = "STALE001 previously hashed resolved content, which included dynamic directive values like project.version. This caused false staleness on every version bump. Now hashes the raw template body, so only actual template edits trigger staleness."
# Pre-release identifier: alpha, beta, rc, or stable
# preid = ""
include = ["pypi"]
exclude = []

