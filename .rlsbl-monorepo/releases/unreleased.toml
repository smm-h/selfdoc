[releasables.selfdoc]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Dead links between a project's pages and its posts on the unified site"
# Optional context explaining why these changes were made
context = """
The live deploy refused the assembled tree: a pgdesign documentation page
linked its own post at an address inside the project's subtree, and the post
linked back at an address at the site root. Both named files no build writes.
The engine floor moves to selfdoc-core 0.9.2, which writes each of those
references against the root that serves the target.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["npm", "pypi"]
exclude = []

[releasables.selfdoc-core]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "patch"
# Short description of this release (required)
description = "A reference crossing a shared site's mount names the root that serves it"
# Optional context explaining why these changes were made
context = """
A mounted project is served two roots at once: its documentation under its
slug, its posts at the site root. The earlier mount fix covered one surface,
the sidebar's project-page-to-post link, and left three writing a relative hop
into nothing -- cross-page term links in both directions, the auto-glossary's
Source link to a term defined in a post, and every project-page reference a
post itself writes. The hop is now chosen per reference from the root the
target belongs to, and the grafted-assembly fixture defines a term on each
side of the boundary so the deploy's own verification sees them.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["pypi"]
exclude = []

[releasables.selfblog]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Floor the engine at the version that addresses a mount correctly"
# Optional context explaining why these changes were made
context = """
selfblog renders every post through selfdoc-core, so a posts-only publish for
a mounted project produced the same dead references the full build did. The
floor names selfdoc-core 0.9.2 rather than leaving a consumer to resolve an
engine that writes them.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["npm", "pypi"]
exclude = []
