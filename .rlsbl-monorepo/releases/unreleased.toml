# (selfdoc: one unreleased fix, deliberately not shipped in this run)

[releasables.selfdoc-core]
# Version bump type: patch, minor, major, infra, or prerelease
bump = "patch"
# Short description of this release (required)
description = "Published validators regenerated against the current strictspec runtime, so registry installs import again; project-name detection honors the declared source language in polyglot repositories."
# Optional context explaining why these changes were made
context = """
The validators shipped in the previous release were generated by strictspec
0.1.0; strictspec's runtime pairing is an exact version match and floor-only
dependencies resolve the newest runtime, so every registry install of this
package has failed at import since strictspec 0.2.0 shipped. The regenerated
validators and the matching strictspec floor were committed weeks ago and
never released; this release ships them.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). Per package, so one workspace release
# can ship some packages stable and others as alphas. See
# docs/release-workflow.md#the-pre-release-channel.
# preid = ""
include = ["pypi"]
exclude = []

