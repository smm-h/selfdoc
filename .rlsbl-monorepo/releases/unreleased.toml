[releasables.selfdoc]
bump = "patch"
description = "Fix CI: install playwright browsers before running tests, fix publish gate regex"
context = "v0.28.0 CI failed because playwright browsers were not installed. The publish gate regex also did not match the actual CI job name. Both are fixed."
include = ["npm", "pypi"]
exclude = []

[releasables.selfdoc-core]
bump = "patch"
description = "Fix CI: point test paths at selfdoc-core's own test directory, fix publish gate regex"
context = "v0.1.0 CI failed because testpaths pointed at shared tests that depend on strictcli (not a selfdoc-core dependency). Created selfdoc-core-specific smoke tests."
include = ["pypi"]
exclude = []

