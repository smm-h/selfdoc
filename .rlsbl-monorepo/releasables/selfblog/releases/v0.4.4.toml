# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 1
bump = "patch"
include = ["npm", "pypi"]
exclude = []
description = "The site home keeps its own pages across a deploy"
context = "Publishing the assembly's home project revealed it: the site root is the\nhome project's content root, so a page of its at cv/index.html emits at\nsite/cv/, beside the project subtrees rather than inside one. The\nmembership reconciler swept every directory under site/ as a project and\ndeleted that one on every deploy. home_owned_root_names has answered this\nsince it was written, and only the roster check was asking it."
