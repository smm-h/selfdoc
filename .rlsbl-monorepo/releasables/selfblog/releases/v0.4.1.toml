# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 1
bump = "patch"
include = ["npm", "pypi"]
exclude = []
description = "Repairs the publish path: the assembly's remote file listing is a GET again, so pushing to the assembly works."
context = "0.4.0 shipped the Trees-API listing with `gh api -f recursive=1`, which attaches\na request body and so makes gh send a POST. POST is not a route on that\nendpoint, GitHub answered 404, and every command that reads the assembly before\nwriting to it -- `assembly sync-workflow`, `docs publish`, `post publish`,\n`assembly retire` -- failed with `list tree: gh: Not Found`. The request now\npins `--method GET`."
