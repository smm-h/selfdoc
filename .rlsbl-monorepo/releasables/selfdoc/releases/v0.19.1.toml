context = "version_source was added in v0.16.0 to read the project version from manifest files. Investigation revealed rlsbl already bumps selfdoc.json during releases via _bump_selfdoc_version, making version_source redundant. Reverted to reduce complexity."
include = ["npm", "pypi"]
exclude = []
