# Archived by rlsbl at release time. This release had no unreleased.toml
# (a batch member takes its metadata from the batch release file); the
# archive is written so later changelog regenerations keep the
# description and context.
# strictspec document version gate (do not remove)
format_version = 1
bump = "patch"
include = ["pypi"]
exclude = []
description = "Repairs the unified-site deploy in the shared engine: mounted-project post addressing, no unreachable per-project 404, reference pages that mark extracted code as code and renest doc-comment headings, and declared dependency floors."
